[project]
name = "support-copilot"
version = "0.1.0"
description = "Support-ticket co-pilot for a retail forex/CFD broker: classify, draft grounded replies, route to humans."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
copilot = "copilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
